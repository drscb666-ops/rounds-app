<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {

  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  .rl-body { flex: 1; overflow-y: auto; padding: 16px; }

  .rl-header { padding: max(20px, env(safe-area-inset-top)) 20px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .rl-header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .rl-title { font-family: var(--font-head); font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .rl-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .rl-stats { display: flex; align-items: baseline; gap: 22px; margin-top: 16px; }
  .rl-stat-num { font-family: var(--font-head); font-size: 34px; font-weight: 600; line-height: 1; }
  .rl-stat-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .rl-streak { display: flex; align-items: center; gap: 5px; color: var(--ochre); font-size: 14px; font-weight: 500; }

  .rl-tabbar { display: flex; background: var(--surface); border-bottom: 1px solid var(--line); }
  .rl-tab { flex: 1; padding: 12px 0; text-align: center; font-size: 13.5px; font-weight: 500; color: var(--ink-soft); background: none; border: none; cursor: pointer; position: relative; font-family: var(--font-body); }
  .rl-tab.active { color: var(--teal); }
  .rl-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 22%; right: 22%; height: 2px; background: var(--teal); border-radius: 2px; }

  .rl-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .rl-section-label { font-size: 12px; color: var(--ink-soft); font-weight: 500; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

  .rl-field { margin-bottom: 14px; }
  .rl-field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .rl-input {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14.5px; font-family: var(--font-body); color: var(--ink); background: var(--surface);
  }
  .rl-input:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }

  .rl-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .rl-chip {
    padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface);
    font-size: 13px; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none;

  .rl-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .rl-btn {

    font-size: 14.5px; font-weight: 500; cursor: pointer; font-family: var(--font-body);

  .rl-btn:disabled { background: #B9C4C1; cursor: not-allowed; }

  .rl-row2 { display: flex; gap: 10px; }

  .install-hint {
    display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 12.5px; color: var(--ink-soft); margin: 12px 16px 0;

  .auth-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; }

  .footer-credit { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 10px 0 26px; line-height: 1.7; }

<body>
<div id="app"></div>
<div id="installHint" class="install-hint">
  <b>Install this app:</b> tap the Share icon, then "Add to Home Screen" (iPhone/iPad), or use your browser menu → "Install app" (Android/desktop Chrome).
</div>

<script>
/* ---------- helpers ---------- */
const PALETTE = ["#2F6F6B", "#C08A28", "#6B4C6B", "#4C6B8A", "#A6553C", "#7A8B5E", "#8A5A6B", "#3D6B4C"];
const WEEKDAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ""; return d.innerHTML; }
function nowLocalISO() {
  const d = new Date(); const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,16);
}
function nowParts(){ const iso = nowLocalISO(); const [d,t] = iso.split("T"); return { d, t }; }
function dateKey(d){ const dt=new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; }
function startOfDay(d){ const dt=new Date(d); dt.setHours(0,0,0,0); return dt; }
function formatDuration(min){ min=Math.round(min); if(min<60) return `${min}m`; const h=Math.floor(min/60), m=min%60; return m?`${h}h ${m}m`:`${h}h`; }
function formatHoursShort(min){ return (min/60).toFixed(1); }
function getMonday(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function formatShortDate(d){ return d.toLocaleDateString(undefined,{month:"short", day:"numeric"}); }

/* ---------- state ---------- */
let subjects = [];
let entries = [];
let tab = "log";
let page = "main"; // "main" | "profile"
let period = "week";
let periodOffset = 0;
let subjectFilter = "all";
let selectedSubjectId = "";
let hours = 0, minutes = 30;
let _np0 = nowParts();
let dateVal = _np0.d;
let timeVal = _np0.t;
let addingSubject = false;
let managingSubjects = false;
let pendingDeleteEntryId = null;
let pieChart = null, barChart = null;
let currentUser = null;
let authMode = "signin";
let authError = "";
let authBusy = false;
let unsubSubjects = null, unsubEntries = null, unsubSettings = null;
let userSettings = { weeklyTargetMinutes: null, photoURL: null };
let editingSubjectId = null;
let colorPickerOpenId = null;
let profileMsg = "";
let exportScope = "all";

/* ---------- icons ---------- */
const ICONS = {
  plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  x: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  check: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></path></svg>`,
  flame: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-4 5-4 9a4 4 0 0 0 8 0c1.5 1 2 2.6 2 4a6 6 0 1 1-12 0c0-5 3-8 6-13z"/></svg>`,
  book: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#DEE4DF" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  chevronLeft: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`,
  chevronRight: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
  pencil: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
  arrowUp: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`,
  arrowDown: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  download: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
};

/* ---------- firebase ---------- */
let auth = null, db = null, firebaseReady = false;
try {
  if (typeof firebaseConfig !== "undefined" && firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    try { db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
    firebaseReady = true;
  }
} catch (e) { firebaseReady = false; }

function attachListeners(uid) {
  detachListeners();
  unsubSubjects = db.collection("users").doc(uid).collection("subjects").orderBy("createdAt", "asc")
    .onSnapshot((snap) => {
      subjects = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    });
  unsubEntries = db.collection("users").doc(uid).collection("entries").orderBy("completedAt", "desc")
    .onSnapshot((snap) => {
      entries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    });
  unsubSettings = db.collection("users").doc(uid).onSnapshot((doc) => {
    const data = doc.data() || {};
    userSettings = { weeklyTargetMinutes: data.weeklyTargetMinutes ?? null, photoURL: data.photoURL ?? null };
    render();
  });
}
function detachListeners() {
  if (unsubSubjects) { unsubSubjects(); unsubSubjects = null; }
  if (unsubEntries) { unsubEntries(); unsubEntries = null; }
  if (unsubSettings) { unsubSettings(); unsubSettings = null; }
}

function getSortedSubjects(){
  return [...subjects].sort((a,b) => (a.order ?? 9999) - (b.order ?? 9999));
}

function addSubject(name){
  const trimmed = name.trim();
  if (!trimmed || !currentUser) return;
  if (subjects.some(s => s.name.toLowerCase() === trimmed.toLowerCase())) return;
  const maxOrder = subjects.reduce((m,s) => Math.max(m, s.order ?? -1), -1);
  db.collection("users").doc(currentUser.uid).collection("subjects").add({
    name: trimmed, color: PALETTE[subjects.length % PALETTE.length],
    order: maxOrder + 1,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
}
function deleteSubject(id){
  if (!currentUser) return;
  if (entries.some(e => e.subjectId === id)) return;
  db.collection("users").doc(currentUser.uid).collection("subjects").doc(id).delete();
}
function renameSubject(id, name){
  const trimmed = name.trim();
  if (!trimmed || !currentUser) return;
  db.collection("users").doc(currentUser.uid).collection("subjects").doc(id).update({ name: trimmed });
}
function setSubjectColor(id, color){
  if (!currentUser) return;
  db.collection("users").doc(currentUser.uid).collection("subjects").doc(id).update({ color });
}
function moveSubject(id, direction){
  if (!currentUser) return;
  const sorted = getSortedSubjects();
  const idx = sorted.findIndex(s => s.id === id);
  const swapIdx = idx + direction;
  if (idx < 0 || swapIdx < 0 || swapIdx >= sorted.length) return;
  const arr = [...sorted];
  const tmp = arr[idx]; arr[idx] = arr[swapIdx]; arr[swapIdx] = tmp;
  const batch = db.batch();
  arr.forEach((s, i) => {
    batch.set(db.collection("users").doc(currentUser.uid).collection("subjects").doc(s.id), { order: i }, { merge: true });
  });
  batch.commit();
}
function addEntry(e){
  if (!currentUser) return;
  db.collection("users").doc(currentUser.uid).collection("entries").add(e);
}
function deleteEntry(id){
  if (!currentUser) return;
  db.collection("users").doc(currentUser.uid).collection("entries").doc(id).delete();
}
function saveSettings(partial){
  if (!currentUser) return;
  db.collection("users").doc(currentUser.uid).set(partial, { merge: true }).catch(() => {});
}

function normalizeDuration(){
  const total = hours*60 + minutes;
  hours = Math.floor(total/60);
  minutes = total % 60;
}

function computeStreak(){
  const days = new Set(entries.map(e => dateKey(e.completedAt)));
  let count = 0, cursor = startOfDay(new Date());
  while (days.has(dateKey(cursor))) { count++; cursor = new Date(cursor.getTime() - 86400000); }
  return count;
}

function getPeriodRange(p, offset){
  const now = new Date();
  if (p === "today") {
    const start = startOfDay(new Date(now.getTime() - offset*86400000));
    const end = new Date(start.getTime() + 86400000);
    return { start, end };
  }
  if (p === "week") {
    const start = new Date(getMonday(now).getTime() - offset*7*86400000);
    const end = new Date(start.getTime() + 7*86400000);
    return { start, end };
  }
  if (p === "month") {
    const start = new Date(now.getFullYear(), now.getMonth() - offset, 1);
    const end = new Date(start.getFullYear(), start.getMonth()+1, 1);
    return { start, end };
  }
  return { start: new Date(0), end: new Date(now.getTime() + 86400000) };
}
function periodRangeLabel(p, offset){
  const { start } = getPeriodRange(p, offset);
  if (p === "today") return offset === 0 ? "Today" : formatShortDate(start);
  if (p === "week") { const sunday = new Date(start.getTime() + 6*86400000); return `${formatShortDate(start)} – ${formatShortDate(sunday)}`; }
  if (p === "month") return start.toLocaleDateString(undefined,{month:"long", year:"numeric"});
  return "All time";
}

/* ---------- photo upload ---------- */
function handlePhotoFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2, sy = (img.height - minSide) / 2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      saveSettings({ photoURL: dataUrl });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- export ---------- */
function exportToExcel(){
  const scope = exportScope;
  let rangeStart, rangeEnd;
  if (scope === "week") { const r = getPeriodRange("week", 0); rangeStart = r.start; rangeEnd = r.end; }
  else if (scope === "month") { const r = getPeriodRange("month", 0); rangeStart = r.start; rangeEnd = r.end; }
  else { rangeStart = new Date(0); rangeEnd = new Date(Date.now() + 86400000); }

  const subjMap = Object.fromEntries(subjects.map(s => [s.id, s]));
  const scoped = entries
    .filter(e => { const t = new Date(e.completedAt); return t >= rangeStart && t < rangeEnd; })
    .sort((a,b) => new Date(a.completedAt) - new Date(b.completedAt));

  const entryRows = scoped.map(e => {
    const dt = new Date(e.completedAt);
    return {
      Date: dt.toLocaleDateString(),
      Time: dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }),
      Subject: subjMap[e.subjectId]?.name || "Unknown",
      "Lecture Title": e.title,
      "Duration (minutes)": e.durationMin,
      "Duration": formatDuration(e.durationMin),
    };
  });

  const summaryMap = {};
  scoped.forEach(e => {
    const name = subjMap[e.subjectId]?.name || "Unknown";
    if (!summaryMap[name]) summaryMap[name] = { minutes: 0, count: 0 };
    summaryMap[name].minutes += e.durationMin;
    summaryMap[name].count += 1;
  });
  const summaryRows = Object.entries(summaryMap).map(([name, v]) => ({
    Subject: name,
    "Lectures": v.count,
    "Total Minutes": v.minutes,
    "Total Hours": (v.minutes/60).toFixed(2),
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(entryRows.length ? entryRows : [{ "No data": "No lectures in this range" }]), "Entries");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows.length ? summaryRows : [{ "No data": "No lectures in this range" }]), "Subject Summary");
  const scopeLabel = scope === "all" ? "all-time" : scope;
  XLSX.writeFile(wb, `rounds-export-${scopeLabel}-${dateKey(new Date())}.xlsx`);
}

/* ---------- auth screen ---------- */
function renderAuth(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-title">Rounds</div>
      <div class="auth-sub">${authMode === "signin" ? "Sign in to sync your lecture log." : "Create an account to sync across devices."}</div>
      ${authError ? `<div class="auth-error">${esc(authError)}</div>` : ""}
      <div class="rl-field">
        <label>Email</label>
        <input class="rl-input" id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="rl-field">
        <label>Password</label>
        <input class="rl-input" id="authPassword" type="password" autocomplete="${authMode === "signin" ? "current-password" : "new-password"}" placeholder="At least 6 characters" />
      </div>
      <button class="rl-btn" id="authSubmit" ${authBusy ? "disabled" : ""}>
        ${authBusy ? "Please wait…" : (authMode === "signin" ? "Sign in" : "Create account")}
      </button>
      <div class="auth-toggle">
        ${authMode === "signin" ? `New here? <span id="authToggle">Create an account</span>` : `Already have an account? <span id="authToggle">Sign in</span>`}
      </div>
    </div>
  `;
  document.getElementById("authToggle").addEventListener("click", () => { authMode = authMode === "signin" ? "signup" : "signin"; authError = ""; renderAuth(); });
  document.getElementById("authSubmit").addEventListener("click", handleAuthSubmit);
  document.getElementById("authPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") handleAuthSubmit(); });
}

async function handleAuthSubmit(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  if (!email || password.length < 6) { authError = "Enter an email and a password of at least 6 characters."; renderAuth(); return; }
  authBusy = true; authError = ""; renderAuth();
  try {
    if (authMode === "signin") await auth.signInWithEmailAndPassword(email, password);
    else await auth.createUserWithEmailAndPassword(email, password);
  } catch (err) {
    authError = err.message || "Something went wrong. Try again.";
  }
  authBusy = false;
  renderAuth();
}

function historyTabHTML(){

function getTrendData(p, filtered, offset){
  if (p === "week") {
    const { start } = getPeriodRange("week", offset);
    const days = [];
    for (let i=0;i<7;i++){ const d=new Date(start.getTime()+i*86400000); days.push({key:dateKey(d), label:WEEKDAY[d.getDay()]}); }
    return days.map(d => ({ label: d.label, minutes: filtered.reduce((sum,e)=> dateKey(e.completedAt)===d.key?sum+e.durationMin:sum,0) }));
  }
  if (p === "month") {
    const { start } = getPeriodRange("month", offset);
    const year = start.getFullYear(), monthIdx = start.getMonth();
    const daysInMonth = new Date(year, monthIdx+1, 0).getDate();
    const buckets = [];
    for (let day=1; day<=daysInMonth; day++){
      const key = `${year}-${String(monthIdx+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      buckets.push({ key, label: String(day) });
    }
    return buckets.map(b => ({ label: b.label, minutes: filtered.reduce((sum,e)=> dateKey(e.completedAt)===b.key?sum+e.durationMin:sum,0) }));
  }
  const map = {};
  filtered.forEach(e => { const d=new Date(e.completedAt); const key=`${d.getFullYear()}-${d.getMonth()}`; map[key]=(map[key]||0)+e.durationMin; });
  const keys = Object.keys(map).sort((a,b)=>{ const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return ya-yb || ma-mb; });
  return keys.slice(-12).map(k => { const [y,m]=k.split("-").map(Number); return { label:`${MONTH_SHORT[m]} '${String(y).slice(2)}`, minutes: map[k] }; });
}

function analyzeTabHTML(){
  if (entries.length === 0) return `<div class="rl-empty">${ICONS.book}<div style="margin-top:10px;">Log a few lectures and your breakdown will show up here.</div></div>`;

  const sortedSubjects = getSortedSubjects();
  const subjMap = Object.fromEntries(subjects.map(s => [s.id, s]));
  const { start, end } = getPeriodRange(period, periodOffset);
  const periodFiltered = entries.filter(e => { const t = new Date(e.completedAt); return t >= start && t < end; });
  const filtered = subjectFilter === "all" ? periodFiltered : periodFiltered.filter(e => e.subjectId === subjectFilter);
  const totalMin = filtered.reduce((a,e) => a + e.durationMin, 0);
  const avgPerLecture = filtered.length ? totalMin / filtered.length : 0;

  let html = `
    <div class="rl-period-row">
      ${["today","week","month","all"].map(p => `<button class="rl-period-btn ${period===p?"active":""}" data-period="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}
    </div>
    ${sortedSubjects.length ? `
      <div class="rl-chip-row" style="margin-bottom:14px;">
        <span class="rl-chip small subj-filter-chip" data-sid="all" style="${subjectFilter==="all"?"background:var(--ink);border-color:var(--ink);color:white;":""}">All subjects</span>
        ${sortedSubjects.map(s => `<span class="rl-chip small subj-filter-chip" data-sid="${s.id}" style="${subjectFilter===s.id?`background:${s.color};border-color:${s.color};color:white;`:""}"><span class="rl-dot" style="background:${subjectFilter===s.id?"white":s.color}"></span>${esc(s.name)}</span>`).join("")}
      </div>
    ` : ""}
    <div class="rl-card card-gap">
      <div class="rl-section-label" style="justify-content:space-between;">
        <span class="period-nav-btn" id="prevPeriodBtn" style="${period==="all"?"visibility:hidden;":""}">${ICONS.chevronLeft}</span>
        <span>${periodRangeLabel(period, periodOffset)}</span>
        <span class="period-nav-btn" id="nextPeriodBtn" style="${period==="all"?"visibility:hidden;":(periodOffset===0?"opacity:0.35;":"")}">${ICONS.chevronRight}</span>
      </div>
      <div class="rl-stat-num" style="font-size:30px;">${formatDuration(totalMin)}</div>
      ${(period==="week"||period==="month") && filtered.length>0 ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">avg ${formatDuration(avgPerLecture)} per lecture</div>` : ""}
    </div>
  `;

  if (filtered.length === 0) {
    html += `<div class="rl-empty">Nothing logged in this period yet.</div>`;
    setTimeout(() => { if (pieChart){pieChart.destroy();pieChart=null;} if (barChart){barChart.destroy();barChart=null;} }, 0);
    return html;
  }

  if (period === "today") {
    const dayEntries = [...filtered].sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt));
    html += `<div class="rl-card card-gap">
      <div class="rl-section-label"><span>Lectures this day</span></div>
      ${dayEntries.map(e => { const subj = subjMap[e.subjectId]; return `
        <div class="rl-entry">
          <span class="rl-dot" style="background:${subj?subj.color:"#999"}"></span>
          <div style="flex:1;">
            <div class="rl-entry-title">${esc(e.title)}</div>
            <div class="rl-entry-meta">${subj?esc(subj.name):"Unknown"} · ${formatDuration(e.durationMin)} · ${new Date(e.completedAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</div>
          </div>
        </div>`; }).join("")}
    </div>`;
  }

  let pieData = [];
  if (subjectFilter === "all") {
    const map = {};
    filtered.forEach(e => { map[e.subjectId] = (map[e.subjectId]||0) + e.durationMin; });
    pieData = Object.entries(map).map(([id,mins]) => ({ id, name: subjMap[id]?.name||"Unknown", minutes: mins, color: subjMap[id]?.color||"#999" })).sort((a,b)=>b.minutes-a.minutes);
    html += `
      <div class="rl-card card-gap">
        <div class="rl-section-label"><span>By subject</span></div>
        <div style="height:200px;"><canvas id="pieCanvas"></canvas></div>
        <div style="margin-top:4px;">
          ${pieData.map(d => `<div class="rl-legend-item"><div class="rl-legend-left"><span class="rl-dot" style="background:${d.color}"></span>${esc(d.name)}</div><div class="rl-legend-val">${formatDuration(d.minutes)} · ${Math.round((d.minutes/totalMin)*100)}%</div></div>`).join("")}
        </div>
      </div>
    `;
  }

  let trend = [];
  let avgBucket = null;
  if (period !== "today") {
    trend = getTrendData(period, filtered, periodOffset);
    if (period === "week" || period === "month") {
      avgBucket = trend.length ? trend.reduce((s,d)=>s+d.minutes,0) / trend.length : 0;
    }
    const isHorizontal = period === "month";
    const heightPx = isHorizontal ? Math.max(300, trend.length*22) : 180;
    html += `
      <div class="rl-card">
        <div class="rl-section-label"><span>Trend</span></div>
        <div style="height:${heightPx}px;"><canvas id="barCanvas"></canvas></div>
      </div>
    `;
  }

  setTimeout(() => drawCharts(pieData, trend, period, avgBucket), 0);
  return html;
}

function drawCharts(pieData, trendData, period, avgBucket){
  if (pieChart) { pieChart.destroy(); pieChart = null; }
  if (barChart) { barChart.destroy(); barChart = null; }
  const pieEl = document.getElementById("pieCanvas");
  if (pieEl && pieData.length) {
    pieChart = new Chart(pieEl, {
      type: "doughnut",
      data: { labels: pieData.map(d=>d.name), datasets: [{ data: pieData.map(d=>d.minutes), backgroundColor: pieData.map(d=>d.color), borderColor: "#fff", borderWidth: 2 }] },
      options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${formatDuration(ctx.raw)}` } } }, cutout: "58%", maintainAspectRatio: false }
    });
  }
  const barEl = document.getElementById("barCanvas");
  if (barEl && trendData.length) {
    const horizontal = period === "month";
    const annotationCfg = (avgBucket != null) ? {
      annotations: {
        avgLine: horizontal
          ? { type: "line", xMin: avgBucket, xMax: avgBucket, borderColor: "#C08A28", borderWidth: 2, borderDash: [6,4] }
          : { type: "line", yMin: avgBucket, yMax: avgBucket, borderColor: "#C08A28", borderWidth: 2, borderDash: [6,4] }
      }
    } : {};
    barChart = new Chart(barEl, {
      type: "bar",
      data: { labels: trendData.map(d=>d.label), datasets: [{ data: trendData.map(d=>d.minutes), backgroundColor: "#2F6F6B", borderRadius: 4, maxBarThickness: horizontal?16:34 }] },
      options: {
        indexAxis: horizontal ? "y" : "x",
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => formatDuration(ctx.raw) } }, annotation: annotationCfg },
        scales: horizontal ? {
          x: { grid: { color: "#EAEEEA" }, ticks: { font: { family: "IBM Plex Sans", size: 10 }, color: "#5B6C67", callback: (v) => `${Math.round(v/60)}h` } },
          y: { grid: { display: false }, ticks: { font: { family: "IBM Plex Sans", size: 10 }, color: "#5B6C67" } }
        } : {
          x: { grid: { display: false }, ticks: { font: { family: "IBM Plex Sans", size: 11 }, color: "#5B6C67" } },
          y: { grid: { color: "#EAEEEA" }, ticks: { font: { family: "IBM Plex Sans", size: 11 }, color: "#5B6C67", callback: (v) => `${Math.round(v/60)}h` } }
        }
      }
    });
  }
}

              <input id="newSubjectInput" placeholder="Subject name" style="border:none;outline:none;font-size:13px;width:110px;font-family:var(--font-body);" />
              <span id="confirmSubjectBtn" style="display:flex;color:var(--teal);cursor:pointer;">${ICONS.check}</span>
              <span id="cancelSubjectBtn" style="display:flex;color:var(--ink-soft);cursor:pointer;">${ICONS.x}</span>
            </span>
          ` : `<span class="rl-chip ghost" id="addSubjectBtn">${ICONS.plus} Add subject</span>`}
        </div>
      </div>

      <div class="rl-card card-gap">
        <div class="rl-section-label"><span>Export data</span></div>
        <div class="rl-chip-row" style="margin-bottom:12px;">
          ${[["all","All time"],["week","This week"],["month","This month"]].map(([v,l]) => `<span class="rl-chip small export-scope" data-scope="${v}" style="${exportScope===v?"background:var(--teal);border-color:var(--teal);color:white;":""}">${l}</span>`).join("")}
        </div>
        <button class="rl-btn" id="exportBtn">${ICONS.download} Export to Excel</button>
      </div>

      <button class="rl-btn" id="profileSignOutBtn" style="background:var(--danger);margin-bottom:8px;">Sign out</button>

      <div class="footer-credit">
        Created with love &amp; care by Subhashis Bauri ♥️<br/>
        Version 1.3
      </div>
    </div>
  `;
}

function renderProfilePage(){
  document.getElementById("app").innerHTML = profilePageHTML();
  attachProfileHandlers();
}

function attachProfileHandlers(){
  document.getElementById("backBtn").addEventListener("click", () => { page = "main"; profileMsg = ""; render(); });
  document.getElementById("avatarBigBtn").addEventListener("click", () => document.getElementById("photoInput").click());
  document.getElementById("changePhotoLink").addEventListener("click", () => document.getElementById("photoInput").click());
  document.getElementById("photoInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) handlePhotoFile(file);
  });

  document.getElementById("savePasswordBtn").addEventListener("click", async () => {
    const val = document.getElementById("newPasswordInput").value;
    if (val.length < 6) { profileMsg = "Password must be at least 6 characters."; renderProfilePage(); return; }
    try {
      await currentUser.updatePassword(val);
      profileMsg = "Password updated.";
    } catch (err) {
      profileMsg = err.code === "auth/requires-recent-login" ? "For security, please sign out and sign in again, then retry." : (err.message || "Couldn't update password.");
    }
    renderProfilePage();
  });

  document.getElementById("saveTargetBtn").addEventListener("click", () => {
    const h = Number(document.getElementById("targetHoursInput").value) || 0;
    const m = Number(document.getElementById("targetMinutesInput").value) || 0;
    saveSettings({ weeklyTargetMinutes: h*60 + m });
    profileMsg = "Target saved.";
    renderProfilePage();
  });

  document.querySelectorAll(".subj-color-dot").forEach(el => el.addEventListener("click", () => {
    colorPickerOpenId = (colorPickerOpenId === el.dataset.id) ? null : el.dataset.id;
    renderProfilePage();
  }));
  document.querySelectorAll(".pick-color").forEach(el => el.addEventListener("click", () => {
    setSubjectColor(el.dataset.id, el.dataset.color);
    colorPickerOpenId = null;
  }));
  document.querySelectorAll(".edit-subj-name").forEach(el => el.addEventListener("click", () => {
    editingSubjectId = el.dataset.id; renderProfilePage();
    setTimeout(() => document.getElementById("renameInput")?.focus(), 0);
  }));
  document.querySelectorAll(".save-rename").forEach(el => el.addEventListener("click", () => {
    const val = document.getElementById("renameInput").value;
    renameSubject(el.dataset.id, val);
    editingSubjectId = null;
  }));
  document.querySelectorAll(".cancel-rename").forEach(el => el.addEventListener("click", () => { editingSubjectId = null; renderProfilePage(); }));
  document.querySelectorAll(".move-up").forEach(el => el.addEventListener("click", () => moveSubject(el.dataset.id, -1)));
  document.querySelectorAll(".move-down").forEach(el => el.addEventListener("click", () => moveSubject(el.dataset.id, 1)));
  document.querySelectorAll(".del-subj-profile").forEach(el => el.addEventListener("click", () => deleteSubject(el.dataset.id)));

  const addBtn = document.getElementById("addSubjectBtn");
  if (addBtn) addBtn.addEventListener("click", () => { addingSubject = true; renderProfilePage(); setTimeout(()=>document.getElementById("newSubjectInput")?.focus(),0); });
  const confirmBtn = document.getElementById("confirmSubjectBtn");
  if (confirmBtn) confirmBtn.addEventListener("click", () => { addSubject(document.getElementById("newSubjectInput").value); addingSubject = false; renderProfilePage(); });
  const newSubjInput = document.getElementById("newSubjectInput");
  if (newSubjInput) newSubjInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { addSubject(e.target.value); addingSubject = false; renderProfilePage(); } });
  const cancelSubjBtn = document.getElementById("cancelSubjectBtn");
  if (cancelSubjBtn) cancelSubjBtn.addEventListener("click", () => { addingSubject = false; renderProfilePage(); });

  document.querySelectorAll(".export-scope").forEach(el => el.addEventListener("click", () => { exportScope = el.dataset.scope; renderProfilePage(); }));
  document.getElementById("exportBtn").addEventListener("click", exportToExcel);

  document.getElementById("profileSignOutBtn").addEventListener("click", () => auth.signOut());
}

/* ---------- event handlers (main tabs) ---------- */
function attachHandlers(){
  if (tab === "log") {
    const editBtn = document.getElementById("editSubjectsBtn");
    if (editBtn) editBtn.addEventListener("click", () => { managingSubjects = !managingSubjects; renderBody(); });

    document.querySelectorAll(".subj-chip").forEach(el => el.addEventListener("click", () => {
      if (managingSubjects) return;
      const id = el.dataset.id;
      selectedSubjectId = (selectedSubjectId === id) ? "" : id;
      renderBody();
    }));
    document.querySelectorAll(".del-subj").forEach(el => el.addEventListener("click", (ev) => { ev.stopPropagation(); deleteSubject(el.dataset.id); }));

    const addBtn = document.getElementById("addSubjectBtn");
    if (addBtn) addBtn.addEventListener("click", () => { addingSubject = true; renderBody(); setTimeout(()=>document.getElementById("newSubjectInput")?.focus(),0); });
    const confirmBtn = document.getElementById("confirmSubjectBtn");
    if (confirmBtn) confirmBtn.addEventListener("click", () => { addSubject(document.getElementById("newSubjectInput").value); addingSubject = false; renderBody(); });
    const newSubjInput = document.getElementById("newSubjectInput");
    if (newSubjInput) newSubjInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { addSubject(e.target.value); addingSubject = false; renderBody(); } });
    const cancelBtn = document.getElementById("cancelSubjectBtn");
    if (cancelBtn) cancelBtn.addEventListener("click", () => { addingSubject = false; renderBody(); });

    const hoursInput = document.getElementById("hoursInput");
    if (hoursInput) {
      hoursInput.addEventListener("input", (e) => { hours = Math.max(0, Number(e.target.value)||0); updateSaveBtnState(); });
      hoursInput.addEventListener("change", () => { normalizeDuration(); renderBody(); });
    }
    const minutesInput = document.getElementById("minutesInput");
    if (minutesInput) {
      minutesInput.addEventListener("input", (e) => { minutes = Math.max(0, Number(e.target.value)||0); updateSaveBtnState(); });
      minutesInput.addEventListener("change", () => { normalizeDuration(); renderBody(); });
    }
    const dateInput = document.getElementById("dateInput");
    if (dateInput) dateInput.addEventListener("input", (e) => { dateVal = e.target.value; renderBody(); });
    const timeInput = document.getElementById("timeInput");
    if (timeInput) timeInput.addEventListener("input", (e) => { timeVal = e.target.value; });
    const titleInput = document.getElementById("titleInput");
    if (titleInput) titleInput.addEventListener("input", (e) => { window.__title = e.target.value; });

    const saveBtn = document.getElementById("saveEntryBtn");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      const title = (document.getElementById("titleInput").value || "").trim();
      const durationMin = hours*60 + minutes;
      if (!title || !selectedSubjectId || durationMin <= 0 || !dateVal || !timeVal) return;
      addEntry({ title, subjectId: selectedSubjectId, durationMin, completedAt: new Date(`${dateVal}T${timeVal}`).toISOString() });
      window.__title = ""; hours = 0; minutes = 30;
      const np = nowParts(); dateVal = np.d; timeVal = np.t;
      renderBody();
      const ti = document.getElementById("titleInput");
      if (ti) ti.value = "";
    });
  }

  if (tab === "history") {
    document.querySelectorAll(".rl-del-btn").forEach(el => el.addEventListener("click", () => {
      const id = el.dataset.id;
      if (pendingDeleteEntryId === id) { deleteEntry(id); pendingDeleteEntryId = null; }
      else { pendingDeleteEntryId = id; renderBody(); }
    }));
  }

  if (tab === "analyze") {
    document.querySelectorAll("[data-period]").forEach(el => el.addEventListener("click", () => { period = el.dataset.period; periodOffset = 0; renderBody(); }));
    document.querySelectorAll(".subj-filter-chip").forEach(el => el.addEventListener("click", () => { subjectFilter = el.dataset.sid; renderBody(); }));
    const prevBtn = document.getElementById("prevPeriodBtn");
    if (prevBtn) prevBtn.addEventListener("click", () => { if (period !== "all") { periodOffset++; renderBody(); } });
    const nextBtn = document.getElementById("nextPeriodBtn");
    if (nextBtn) nextBtn.addEventListener("click", () => { if (period !== "all" && periodOffset > 0) { periodOffset--; renderBody(); } });
  }
}

/* ---------- install prompt ---------- */
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); });
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
if (!isStandalone) document.getElementById("installHint").classList.add("show");

/* ---------- service worker ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- boot ---------- */
if (!firebaseReady) {
  renderConfigWarning();
} else {
  document.getElementById("app").innerHTML = `<div class="auth-wrap" style="align-items:center;"><span class="spin">⏳</span></div>`;
  auth.onAuthStateChanged((user) => {
    currentUser = user;
    if (user) { page = "main"; attachListeners(user.uid); render(); }
    else { detachListeners(); subjects = []; entries = []; userSettings = { weeklyTargetMinutes: null, photoURL: null }; render(); }
  });
}
</script>

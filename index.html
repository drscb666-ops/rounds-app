<!DOCTYPE html>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #F3F5F2;
    --surface: #FFFFFF;
    --ink: #182726;
    --ink-soft: #5B6C67;
    --teal: #2F6F6B;
    --ochre: #C08A28;
    --green: #3F8F5B;
    --line: #DEE4DF;
    --danger: #A6553C;
    --font-head: 'Source Serif 4', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    width: 100%; max-width: 480px; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column; background: var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .spin { animation: spin-kf 0.9s linear infinite; display: inline-block; }
  @keyframes spin-kf { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  .rl-body { flex: 1; overflow-y: auto; padding: 16px; }

  .rl-header { padding: max(20px, env(safe-area-inset-top)) 20px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .rl-header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .rl-title { font-family: var(--font-head); font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .rl-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .rl-stats { display: flex; align-items: baseline; gap: 22px; margin-top: 16px; }
  .rl-stat-num { font-family: var(--font-head); font-size: 34px; font-weight: 600; line-height: 1; }
  .rl-stat-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .rl-streak { display: flex; align-items: center; gap: 5px; color: var(--ochre); font-size: 14px; font-weight: 500; }

  .rl-tabbar { display: flex; background: var(--surface); border-bottom: 1px solid var(--line); }
  .rl-tab { flex: 1; padding: 12px 0; text-align: center; font-size: 13.5px; font-weight: 500; color: var(--ink-soft); background: none; border: none; cursor: pointer; position: relative; font-family: var(--font-body); }
  .rl-tab.active { color: var(--teal); }
  .rl-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 22%; right: 22%; height: 2px; background: var(--teal); border-radius: 2px; }

  .rl-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .rl-section-label { font-size: 12px; color: var(--ink-soft); font-weight: 500; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

  .rl-field { margin-bottom: 14px; }
  .rl-field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .rl-input {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14.5px; font-family: var(--font-body); color: var(--ink); background: var(--surface);
  }
  .rl-input:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }

  .rl-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .rl-chip {
    padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface);
    font-size: 13px; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none;
  }
  .rl-chip.ghost { border-style: dashed; color: var(--ink-soft); }
  .rl-chip.small { padding: 5px 11px; font-size: 12.5px; }

  .rl-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .rl-btn {
    width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--teal); color: white;
    font-size: 14.5px; font-weight: 500; cursor: pointer; font-family: var(--font-body);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .rl-btn:disabled { background: #B9C4C1; cursor: not-allowed; }
  .rl-btn.ghost { background: none; color: var(--teal); border: 1px solid var(--teal); }

  .rl-row2 { display: flex; gap: 10px; }
  .rl-row2 > div { flex: 1; }

  .rl-entry { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rl-entry:last-child { border-bottom: none; }
  .rl-entry .rl-dot { margin-top: 5px; }
  .rl-entry-title { font-size: 14px; font-weight: 500; }
  .rl-entry-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .rl-del-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 4px; flex-shrink: 0; }
  .rl-del-btn.confirm { color: var(--danger); }

  .rl-day-heading { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin: 18px 0 4px; }
  .rl-day-heading:first-child { margin-top: 0; }

  .rl-empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 13.5px; }

  .rl-period-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .rl-period-btn {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    font-size: 12.5px; color: var(--ink-soft); cursor: pointer; font-family: var(--font-body);
  }
  .rl-period-btn.active { background: var(--ink); border-color: var(--ink); color: white; }
  .period-nav-btn { display: flex; color: var(--ink-soft); cursor: pointer; padding: 4px; }

  .rl-legend-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 13px; }
  .rl-legend-left { display: flex; align-items: center; gap: 8px; }
  .rl-legend-val { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .card-gap { margin-bottom: 14px; }
  .full-span { }

  .install-hint {
    display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 12.5px; color: var(--ink-soft); margin: 12px 16px 0;
  }
  .install-hint.show { display: block; }
  .install-hint b { color: var(--ink); }

  .auth-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; }
  .auth-title { font-family: var(--font-head); font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  .auth-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 24px; }
  .auth-error { background: #FBEFE9; color: var(--danger); font-size: 12.5px; padding: 9px 12px; border-radius: 8px; margin-bottom: 12px; }
  .auth-toggle { text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: 14px; }
  .auth-toggle span { color: var(--teal); cursor: pointer; font-weight: 500; }
  .config-warning { text-align: center; padding: 40px 24px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.6; }

  .avatar-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--teal); color: white;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-head);
    font-weight: 600; font-size: 16px; border: none; cursor: pointer; flex-shrink: 0; background-size: cover; background-position: center;
  }
  .avatar-btn.big { width: 96px; height: 96px; font-size: 34px; }
  .footer-credit { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 10px 0 26px; line-height: 1.7; }
  .nav-row { cursor: pointer; }
  .nav-row:active { opacity: 0.85; }

  .achv-overlay { position: fixed; inset: 0; background: rgba(20,30,28,0.45); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 24px; }
  .achv-card { border-radius: 16px; padding: 34px 26px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 12px 44px rgba(0,0,0,0.22); }
  .achv-badge { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .achv-title { font-family: var(--font-head); font-size: 23px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
  .achv-line { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .achv-btn { margin-top: 18px; color: white; border: none; border-radius: 8px; padding: 10px 26px; font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: var(--font-body); }

  /* Responsive: tablets (iPad portrait/landscape) and desktop */
  @media (min-width: 680px) {
    #app { max-width: min(1100px, 94vw); }
    .rl-body.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    .rl-body.grid-2 > .card-gap { margin-bottom: 0; }
    .rl-body.grid-2 > .full-span { grid-column: 1 / -1; }
  }
</style>

<body>
<div id="app"></div>
<div id="installHint" class="install-hint">
  <b>Install this app:</b> tap the Share icon, then "Add to Home Screen" (iPhone/iPad), or use your browser menu → "Install app" (Android/desktop Chrome).
</div>

<script>
/* ---------- helpers ---------- */
const PALETTE = ["#2F6F6B", "#C08A28", "#6B4C6B", "#4C6B8A", "#A6553C", "#7A8B5E", "#8A5A6B", "#3D6B4C"];
const WEEKDAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ""; return d.innerHTML; }
function nowLocalISO() {
  const d = new Date(); const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,16);
}
function nowParts(){ const iso = nowLocalISO(); const [d,t] = iso.split("T"); return { d, t }; }
function dateKey(d){ const dt=new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; }
function startOfDay(d){ const dt=new Date(d); dt.setHours(0,0,0,0); return dt; }
function formatDuration(min){ min=Math.round(min); if(min<60) return `${min}m`; const h=Math.floor(min/60), m=min%60; return m?`${h}h ${m}m`:`${h}h`; }
function formatHoursShort(min){ return (min/60).toFixed(1); }
function getMonday(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function formatShortDate(d){ return d.toLocaleDateString(undefined,{month:"short", day:"numeric"}); }

/* ---------- state ---------- */
let subjects = [];
let entries = [];
let tab = "log";
let page = "main"; // main | profile | targets | subjects
let period = "week";
let periodOffset = 0;
let subjectFilter = "all";
let selectedSubjectId = "";
let hours = 0, minutes = 30;
let _np0 = nowParts();
let dateVal = _np0.d;
let timeVal = _np0.t;
let pendingDeleteEntryId = null;
let pieChart = null, barChart = null;
let currentUser = null;
let authMode = "signin";
let authError = "";
let authBusy = false;
let unsubSubjects = null, unsubEntries = null, unsubSettings = null;
let userSettings = { weeklyTargetMinutes: null, photoURL: null, dailyTargets: [], weeklyTargets: [] };
let editingSubjectId = null;
let profileMsg = "";
let exportScope = "all";
let _todayKey0 = dateKey(new Date());
let exportFromDate = _todayKey0;
let exportToDate = _todayKey0;

/* ---------- icons ---------- */
const ICONS = {
  plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  x: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  check: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></path></svg>`,
  flame: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-4 5-4 9a4 4 0 0 0 8 0c1.5 1 2 2.6 2 4a6 6 0 1 1-12 0c0-5 3-8 6-13z"/></svg>`,
  book: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#DEE4DF" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  chevronLeft: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`,
  chevronRight: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
  pencil: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
  arrowUp: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`,
  arrowDown: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  download: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  bigCheck: `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
};

/* ---------- firebase ---------- */
let auth = null, db = null, firebaseReady = false;
try {
  if (typeof firebaseConfig !== "undefined" && firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    try { db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
    firebaseReady = true;
  }
} catch (e) { firebaseReady = false; }

function attachListeners(uid) {
  detachListeners();
  unsubSubjects = db.collection("users").doc(uid).collection("subjects").orderBy("createdAt", "asc")
    .onSnapshot((snap) => { subjects = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); });
  unsubEntries = db.collection("users").doc(uid).collection("entries").orderBy("completedAt", "desc")
    .onSnapshot((snap) => { entries = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); });
  unsubSettings = db.collection("users").doc(uid).onSnapshot((doc) => {
    const data = doc.data() || {};
    userSettings = {
      weeklyTargetMinutes: data.weeklyTargetMinutes ?? null,
      photoURL: data.photoURL ?? null,
      dailyTargets: data.dailyTargets || [],
      weeklyTargets: data.weeklyTargets || [],
    };
    render();
  });
}
function detachListeners() {
  if (unsubSubjects) { unsubSubjects(); unsubSubjects = null; }
  if (unsubEntries) { unsubEntries(); unsubEntries = null; }
  if (unsubSettings) { unsubSettings(); unsubSettings = null; }
}

function getSortedSubjects(){ return [...subjects].sort((a,b) => (a.order ?? 9999) - (b.order ?? 9999)); }

function addSubject(name, shortCode){
  const trimmed = name.trim();
  if (!trimmed || !currentUser) return;
  if (subjects.some(s => s.name.toLowerCase() === trimmed.toLowerCase())) return;
  const maxOrder = subjects.reduce((m,s) => Math.max(m, s.order ?? -1), -1);
  db.collection("users").doc(currentUser.uid).collection("subjects").add({
    name: trimmed,
    shortCode: (shortCode||"").trim().toUpperCase().slice(0,6),
    color: PALETTE[subjects.length % PALETTE.length],
    order: maxOrder + 1,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
}
function deleteSubject(id){
  if (!currentUser) return;
  if (entries.some(e => e.subjectId === id)) return;
  db.collection("users").doc(currentUser.uid).collection("subjects").doc(id).delete();
}
function renameSubject(id, name, shortCode){
  const trimmed = name.trim();
  if (!trimmed || !currentUser) return;
  db.collection("users").doc(currentUser.uid).collection("subjects").doc(id).update({
    name: trimmed, shortCode: (shortCode||"").trim().toUpperCase().slice(0,6),
  });
}
function setSubjectColor(id, color){
  if (!currentUser) return;
  db.collection("users").doc(currentUser.uid).collection("subjects").doc(id).update({ color });
}
function moveSubject(id, direction){
  if (!currentUser) return;
  const sorted = getSortedSubjects();
  const idx = sorted.findIndex(s => s.id === id);
  const swapIdx = idx + direction;
  if (idx < 0 || swapIdx < 0 || swapIdx >= sorted.length) return;
  const arr = [...sorted];
  const tmp = arr[idx]; arr[idx] = arr[swapIdx]; arr[swapIdx] = tmp;
  const batch = db.batch();
  arr.forEach((s, i) => { batch.set(db.collection("users").doc(currentUser.uid).collection("subjects").doc(s.id), { order: i }, { merge: true }); });
  batch.commit();
}
function addEntry(e){ if (!currentUser) return; db.collection("users").doc(currentUser.uid).collection("entries").add(e); }
function deleteEntry(id){ if (!currentUser) return; db.collection("users").doc(currentUser.uid).collection("entries").doc(id).delete(); }
function saveSettings(partial){ if (!currentUser) return; db.collection("users").doc(currentUser.uid).set(partial, { merge: true }).catch(() => {}); }

function addTarget(type, minutes, effectiveFrom){
  if (!currentUser) return;
  const key = type === "daily" ? "dailyTargets" : "weeklyTargets";
  const current = userSettings[key] || [];
  const filtered = current.filter(t => t.effectiveFrom !== effectiveFrom);
  const updated = [...filtered, { minutes, effectiveFrom }].sort((a,b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
  saveSettings({ [key]: updated });
}
function getEffectiveTargetMinutes(history, legacySingle, dateObj){
  const key = dateKey(dateObj);
  let val = legacySingle || 0;
  if (history && history.length) { for (const t of history) { if (t.effectiveFrom <= key) val = t.minutes; } }
  return val;
}

function normalizeDuration(){ const total = hours*60 + minutes; hours = Math.floor(total/60); minutes = total % 60; }

function computeStreak(){
  const days = new Set(entries.map(e => dateKey(e.completedAt)));
  let count = 0, cursor = startOfDay(new Date());
  let iterations = 0;
  while (iterations < 3650) {
    iterations++;
    const key = dateKey(cursor);
    const dow = cursor.getDay();
    const isWeekend = dow === 0 || dow === 6;
    if (days.has(key)) { count++; }
    else if (!isWeekend) { break; }
    cursor = new Date(cursor.getTime() - 86400000);
  }
  return count;
}

function getPeriodRange(p, offset){
  const now = new Date();
  if (p === "today") {
    const start = startOfDay(new Date(now.getTime() - offset*86400000));
    const end = new Date(start.getTime() + 86400000);
    return { start, end };
  }
  if (p === "week") {
    const start = new Date(getMonday(now).getTime() - offset*7*86400000);
    const end = new Date(start.getTime() + 7*86400000);
    return { start, end };
  }
  if (p === "month") {
    const start = new Date(now.getFullYear(), now.getMonth() - offset, 1);
    const end = new Date(start.getFullYear(), start.getMonth()+1, 1);
    return { start, end };
  }
  return { start: new Date(0), end: new Date(now.getTime() + 86400000) };
}
function periodRangeLabel(p, offset){
  const { start } = getPeriodRange(p, offset);
  if (p === "today") return offset === 0 ? "Today" : formatShortDate(start);
  if (p === "week") { const sunday = new Date(start.getTime() + 6*86400000); return `${formatShortDate(start)} – ${formatShortDate(sunday)}`; }
  if (p === "month") return start.toLocaleDateString(undefined,{month:"long", year:"numeric"});
  return "All time";
}

/* ---------- achievements ---------- */
function computeAchievements(newEntry){
  const results = [];
  const newDate = new Date(newEntry.completedAt);
  const todayRange = getPeriodRange("today", 0);
  const weekRange = getPeriodRange("week", 0);
  const isToday = newDate >= todayRange.start && newDate < todayRange.end;
  const isThisWeek = newDate >= weekRange.start && newDate < weekRange.end;

  if (isToday) {
    const dailyTarget = getEffectiveTargetMinutes(userSettings.dailyTargets, null, new Date());
    if (dailyTarget > 0) {
      const before = entries.filter(e => { const t=new Date(e.completedAt); return t>=todayRange.start && t<todayRange.end; }).reduce((a,e)=>a+e.durationMin,0);
      const after = before + newEntry.durationMin;
      if (before < dailyTarget && after >= dailyTarget) results.push("daily");
    }
  }
  if (isThisWeek) {
    const weeklyTarget = getEffectiveTargetMinutes(userSettings.weeklyTargets, userSettings.weeklyTargetMinutes, weekRange.start);
    if (weeklyTarget > 0) {
      const before = entries.filter(e => { const t=new Date(e.completedAt); return t>=weekRange.start && t<weekRange.end; }).reduce((a,e)=>a+e.durationMin,0);
      const after = before + newEntry.durationMin;
      if (before < weeklyTarget && after >= weeklyTarget) results.push("weekly");
    }
  }
  return results;
}

/* ---------- photo upload ---------- */
function handlePhotoFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2, sy = (img.height - minSide) / 2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      saveSettings({ photoURL: dataUrl });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- export ---------- */
function exportToExcel(){
  let rangeStart, rangeEnd, scopeLabel;
  if (exportScope === "custom") {
    if (!exportFromDate || !exportToDate) { profileMsg = "Pick both a from and to date."; renderProfilePage(); return; }
    rangeStart = new Date(exportFromDate + "T00:00:00");
    rangeEnd = new Date(exportToDate + "T23:59:59.999");
    scopeLabel = `${exportFromDate}_to_${exportToDate}`;
  } else {
    rangeStart = new Date(0);
    rangeEnd = new Date(Date.now() + 86400000);
    scopeLabel = "all-time";
  }
  const subjMap = Object.fromEntries(subjects.map(s => [s.id, s]));
  const scoped = entries.filter(e => { const t=new Date(e.completedAt); return t>=rangeStart && t<=rangeEnd; }).sort((a,b)=> new Date(a.completedAt)-new Date(b.completedAt));

  const entryRows = scoped.map(e => {
    const dt = new Date(e.completedAt);
    return {
      Date: dt.toLocaleDateString(), Time: dt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}),
      Subject: subjMap[e.subjectId]?.name || "Unknown", "Lecture Title": e.title,
      "Duration (minutes)": e.durationMin, "Duration": formatDuration(e.durationMin),
    };
  });
  const summaryMap = {};
  scoped.forEach(e => {
    const name = subjMap[e.subjectId]?.name || "Unknown";
    if (!summaryMap[name]) summaryMap[name] = { minutes: 0, count: 0 };
    summaryMap[name].minutes += e.durationMin; summaryMap[name].count += 1;
  });
  const summaryRows = Object.entries(summaryMap).map(([name, v]) => ({ Subject: name, "Lectures": v.count, "Total Minutes": v.minutes, "Total Hours": (v.minutes/60).toFixed(2) }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(entryRows.length ? entryRows : [{ "No data": "No lectures in this range" }]), "Entries");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows.length ? summaryRows : [{ "No data": "No lectures in this range" }]), "Subject Summary");
  XLSX.writeFile(wb, `rounds-export-${scopeLabel}.xlsx`);
}

async function handleAuthSubmit(){
  const email = document.getElementById("authEmail").value.trim();

  if (!email || password.length < 6) { authError = "Enter an email and a password of at least 6 characters."; renderAuth(); return; }

  try {

  authBusy = false;
  renderAuth();

function getTrendData(p, filtered, offset){
  if (p === "week") {
    const { start } = getPeriodRange("week", offset);
    const days = [];
    for (let i=0;i<7;i++){ const d=new Date(start.getTime()+i*86400000); days.push({key:dateKey(d), label:WEEKDAY[d.getDay()]}); }
    return days.map(d => ({ label: d.label, minutes: filtered.reduce((sum,e)=> dateKey(e.completedAt)===d.key?sum+e.durationMin:sum,0) }));
  }
  if (p === "month") {
    const { start } = getPeriodRange("month", offset);
    const year = start.getFullYear(), monthIdx = start.getMonth();
    const daysInMonth = new Date(year, monthIdx+1, 0).getDate();
    const buckets = [];
    for (let day=1; day<=daysInMonth; day++){
      const key = `${year}-${String(monthIdx+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      buckets.push({ key, label: String(day) });
    }
    return buckets.map(b => ({ label: b.label, minutes: filtered.reduce((sum,e)=> dateKey(e.completedAt)===b.key?sum+e.durationMin:sum,0) }));
  }
  const map = {};
  filtered.forEach(e => { const d=new Date(e.completedAt); const key=`${d.getFullYear()}-${d.getMonth()}`; map[key]=(map[key]||0)+e.durationMin; });
  const keys = Object.keys(map).sort((a,b)=>{ const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return ya-yb || ma-mb; });
  return keys.slice(-12).map(k => { const [y,m]=k.split("-").map(Number); return { label:`${MONTH_SHORT[m]} '${String(y).slice(2)}`, minutes: map[k] }; });
}

function analyzeTabHTML(){
  if (entries.length === 0) return `<div class="rl-empty">${ICONS.book}<div style="margin-top:10px;">Log a few lectures and your breakdown will show up here.</div></div>`;

  const sortedSubjects = getSortedSubjects();
  const subjMap = Object.fromEntries(subjects.map(s => [s.id, s]));
  const { start, end } = getPeriodRange(period, periodOffset);
  const periodFiltered = entries.filter(e => { const t = new Date(e.completedAt); return t >= start && t < end; });
  const filtered = subjectFilter === "all" ? periodFiltered : periodFiltered.filter(e => e.subjectId === subjectFilter);
  const totalMin = filtered.reduce((a,e) => a + e.durationMin, 0);
  const avgPerLecture = filtered.length ? totalMin / filtered.length : 0;

  let extraLine = "";
  if (period === "today") {
    const dailyTarget = getEffectiveTargetMinutes(userSettings.dailyTargets, null, start);
    if (dailyTarget > 0) extraLine = `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">target ${formatDuration(dailyTarget)} · ${Math.min(999,Math.round((totalMin/dailyTarget)*100))}%</div>`;
  } else if (period === "week") {
    const weeklyTarget = getEffectiveTargetMinutes(userSettings.weeklyTargets, userSettings.weeklyTargetMinutes, start);
    const avgTxt = filtered.length>0 ? `avg ${formatDuration(avgPerLecture)} per lecture` : "";
    const targetTxt = weeklyTarget>0 ? `target ${formatDuration(weeklyTarget)} · ${Math.min(999,Math.round((totalMin/weeklyTarget)*100))}%` : "";
    if (avgTxt || targetTxt) extraLine = `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">${[avgTxt,targetTxt].filter(Boolean).join(" · ")}</div>`;
  } else if (period === "month" && filtered.length>0) {
    extraLine = `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">avg ${formatDuration(avgPerLecture)} per lecture</div>`;
  }

  let html = `
    <div class="rl-period-row full-span">
      ${["today","week","month","all"].map(p => `<button class="rl-period-btn ${period===p?"active":""}" data-period="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}
    </div>
    ${sortedSubjects.length ? `
      <div class="rl-field full-span" style="margin-bottom:14px;">
        <select class="rl-input" id="subjectFilterSelect">
          <option value="all" ${subjectFilter==="all"?"selected":""}>All subjects</option>
          ${sortedSubjects.map(s => `<option value="${s.id}" ${subjectFilter===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}
        </select>
      </div>
    ` : ""}
    <div class="rl-card card-gap full-span">
      <div class="rl-section-label" style="justify-content:space-between;">
        <span class="period-nav-btn" id="prevPeriodBtn" style="${period==="all"?"visibility:hidden;":""}">${ICONS.chevronLeft}</span>
        <span>${periodRangeLabel(period, periodOffset)}</span>
        <span class="period-nav-btn" id="nextPeriodBtn" style="${period==="all"?"visibility:hidden;":(periodOffset===0?"opacity:0.35;":"")}">${ICONS.chevronRight}</span>
      </div>
      <div class="rl-stat-num" style="font-size:30px;">${formatDuration(totalMin)}</div>
      ${extraLine}
    </div>
  `;

  if (filtered.length === 0) {
    html += `<div class="rl-empty full-span">Nothing logged in this period yet.</div>`;
    setTimeout(() => { if (pieChart){pieChart.destroy();pieChart=null;} if (barChart){barChart.destroy();barChart=null;} }, 0);
    return html;
  }

  if (period === "today") {
    const dayEntries = [...filtered].sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt));
    html += `<div class="rl-card card-gap full-span">
      <div class="rl-section-label"><span>Lectures this day</span></div>
      ${dayEntries.map(e => { const subj = subjMap[e.subjectId]; return `
        <div class="rl-entry">
          <span class="rl-dot" style="background:${subj?subj.color:"#999"}"></span>
          <div style="flex:1;">
            <div class="rl-entry-title">${esc(e.title)}</div>
            <div class="rl-entry-meta">${subj?esc(subj.name):"Unknown"} · ${formatDuration(e.durationMin)} · ${new Date(e.completedAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</div>
          </div>
        </div>`; }).join("")}
    </div>`;
  }

  let pieData = [];
  if (subjectFilter === "all") {
    const map = {};
    filtered.forEach(e => { map[e.subjectId] = (map[e.subjectId]||0) + e.durationMin; });
    pieData = Object.entries(map).map(([id,mins]) => ({ id, name: subjMap[id]?.name||"Unknown", minutes: mins, color: subjMap[id]?.color||"#999" })).sort((a,b)=>b.minutes-a.minutes);
    html += `
      <div class="rl-card card-gap">
        <div class="rl-section-label"><span>By subject</span></div>
        <div style="height:200px;"><canvas id="pieCanvas"></canvas></div>
        <div style="margin-top:4px;">
          ${pieData.map(d => `<div class="rl-legend-item"><div class="rl-legend-left"><span class="rl-dot" style="background:${d.color}"></span>${esc(d.name)}</div><div class="rl-legend-val">${formatDuration(d.minutes)} · ${Math.round((d.minutes/totalMin)*100)}%</div></div>`).join("")}
        </div>
      </div>
    `;
  }

  let trend = [];
  let avgBucket = null;
  let targetBucket = null;
  if (period !== "today") {
    trend = getTrendData(period, filtered, periodOffset);
    if (period === "week" || period === "month") avgBucket = trend.length ? trend.reduce((s,d)=>s+d.minutes,0) / trend.length : 0;
    if (period === "week") {
      const wTarget = getEffectiveTargetMinutes(userSettings.weeklyTargets, userSettings.weeklyTargetMinutes, start);
      if (wTarget > 0) targetBucket = wTarget;
    }
    const isHorizontal = period === "month";
    const heightPx = isHorizontal ? Math.max(300, trend.length*22) : 200;
    html += `
      <div class="rl-card">
        <div class="rl-section-label"><span>Trend</span></div>
        <div style="height:${heightPx}px;"><canvas id="barCanvas"></canvas></div>
      </div>
    `;
  }

  setTimeout(() => drawCharts(pieData, trend, period, avgBucket, targetBucket), 0);
  return html;
}

function drawCharts(pieData, trendData, period, avgBucket, targetBucket){
  if (pieChart) { pieChart.destroy(); pieChart = null; }
  if (barChart) { barChart.destroy(); barChart = null; }
  const pieEl = document.getElementById("pieCanvas");
  if (pieEl && pieData.length) {
    pieChart = new Chart(pieEl, {
      type: "doughnut",
      data: { labels: pieData.map(d=>d.name), datasets: [{ data: pieData.map(d=>d.minutes), backgroundColor: pieData.map(d=>d.color), borderColor: "#fff", borderWidth: 2 }] },
      options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${formatDuration(ctx.raw)}` } } }, cutout: "58%", maintainAspectRatio: false }
    });
  }
  const barEl = document.getElementById("barCanvas");
  if (barEl && trendData.length) {
    const horizontal = period === "month";
    const annotations = {};
    if (avgBucket != null) {
      annotations.avgLine = horizontal
        ? { type: "line", xMin: avgBucket, xMax: avgBucket, borderColor: "#C08A28", borderWidth: 2, borderDash: [6,4], label: { display:true, content:`Avg ${formatDuration(avgBucket)}`, position:"end", backgroundColor:"#C08A28", color:"#fff", font:{size:9,family:"IBM Plex Sans"}, padding:4, borderRadius:4 } }
        : { type: "line", yMin: avgBucket, yMax: avgBucket, borderColor: "#C08A28", borderWidth: 2, borderDash: [6,4], label: { display:true, content:`Avg ${formatDuration(avgBucket)}`, position:"end", backgroundColor:"#C08A28", color:"#fff", font:{size:9,family:"IBM Plex Sans"}, padding:4, borderRadius:4, yAdjust:-12 } };
    }
    if (targetBucket != null) {
      annotations.targetLine = { type: "line", yMin: targetBucket, yMax: targetBucket, borderColor: "#3F8F5B", borderWidth: 2, label: { display:true, content:`Target ${formatDuration(targetBucket)}`, position:"start", backgroundColor:"#3F8F5B", color:"#fff", font:{size:9,family:"IBM Plex Sans"}, padding:4, borderRadius:4, yAdjust:12 } };
    }
    barChart = new Chart(barEl, {
      type: "bar",
      data: { labels: trendData.map(d=>d.label), datasets: [{ data: trendData.map(d=>d.minutes), backgroundColor: "#2F6F6B", borderRadius: 4, maxBarThickness: horizontal?16:34 }] },
      options: {
        indexAxis: horizontal ? "y" : "x",
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => formatDuration(ctx.raw) } }, annotation: { annotations } },
        scales: horizontal ? {
          x: { grid: { color: "#EAEEEA" }, ticks: { font: { family: "IBM Plex Sans", size: 10 }, color: "#5B6C67", callback: (v) => `${Math.round(v/60)}h` } },
          y: { grid: { display: false }, ticks: { font: { family: "IBM Plex Sans", size: 10 }, color: "#5B6C67" } }
        } : {
          x: { grid: { display: false }, ticks: { font: { family: "IBM Plex Sans", size: 11 }, color: "#5B6C67" } },
          y: { grid: { color: "#EAEEEA" }, ticks: { font: { family: "IBM Plex Sans", size: 11 }, color: "#5B6C67", callback: (v) => `${Math.round(v/60)}h` } }
        }
      }
    });
  }
}

      </div>

      ${profileMsg ? `<div class="auth-error" style="background:#E4EEEC;color:var(--teal);">${esc(profileMsg)}</div>` : ""}

      <div class="rl-card card-gap">
        <div class="rl-section-label"><span>Change password</span></div>
        <div class="rl-field"><input class="rl-input" type="password" id="newPasswordInput" placeholder="New password (min 6 characters)" /></div>
        <button class="rl-btn ghost" id="savePasswordBtn">Update password</button>

      <div class="rl-card card-gap nav-row" id="targetsNavRow">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="rl-section-label" style="margin-bottom:2px;"><span>Targets</span></div>

            <div class="rl-section-label" style="margin-bottom:2px;"><span>Subjects</span></div>
            <div style="font-size:12.5px;color:var(--ink-soft);">${subjects.length} subject${subjects.length===1?"":"s"}</div>
          </div>
          <span style="color:var(--ink-soft);display:flex;">${ICONS.chevronRight}</span>
        </div>
      </div>

      <div class="rl-card card-gap">
        <div class="rl-section-label"><span>Export data</span></div>
        <div class="rl-chip-row" style="margin-bottom:12px;">
          ${[["all","All time"],["custom","Custom range"]].map(([v,l]) => `<span class="rl-chip small export-scope" data-scope="${v}" style="${exportScope===v?"background:var(--teal);border-color:var(--teal);color:white;":""}">${l}</span>`).join("")}
        </div>
        ${exportScope === "custom" ? `

            <div><label style="font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:4px;">From</label><input class="rl-input" type="date" id="exportFromDate" value="${exportFromDate}" /></div>
            <div><label style="font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:4px;">To</label><input class="rl-input" type="date" id="exportToDate" value="${exportToDate}" /></div>

      <button class="rl-btn" id="profileSignOutBtn" style="background:var(--danger);margin-bottom:8px;">Sign out</button>

function renderProfilePage(){
  document.getElementById("app").innerHTML = profilePageHTML();
  attachProfileHandlers();
}
function attachProfileHandlers(){
  document.getElementById("backBtn").addEventListener("click", () => { page = "main"; profileMsg = ""; render(); });
  document.getElementById("avatarBigBtn").addEventListener("click", () => document.getElementById("photoInput").click());
  document.getElementById("changePhotoLink").addEventListener("click", () => document.getElementById("photoInput").click());
  document.getElementById("photoInput").addEventListener("change", (e) => { const file = e.target.files[0]; if (file) handlePhotoFile(file); });

  document.getElementById("savePasswordBtn").addEventListener("click", async () => {
    const val = document.getElementById("newPasswordInput").value;
    if (val.length < 6) { profileMsg = "Password must be at least 6 characters."; renderProfilePage(); return; }
    try { await currentUser.updatePassword(val); profileMsg = "Password updated."; }
    catch (err) { profileMsg = err.code === "auth/requires-recent-login" ? "For security, please sign out and sign in again, then retry." : (err.message || "Couldn't update password."); }
    renderProfilePage();
  });

  document.getElementById("targetsNavRow").addEventListener("click", () => { page = "targets"; render(); });
  document.getElementById("subjectsNavRow").addEventListener("click", () => { page = "subjects"; render(); });

  document.querySelectorAll(".export-scope").forEach(el => el.addEventListener("click", () => { exportScope = el.dataset.scope; renderProfilePage(); }));
  const fromInput = document.getElementById("exportFromDate");
  if (fromInput) fromInput.addEventListener("input", (e) => { exportFromDate = e.target.value; });
  const toInput = document.getElementById("exportToDate");
  if (toInput) toInput.addEventListener("input", (e) => { exportToDate = e.target.value; });
  document.getElementById("exportBtn").addEventListener("click", exportToExcel);

  document.getElementById("profileSignOutBtn").addEventListener("click", () => auth.signOut());
}

/* ---------- targets page ---------- */
function targetsPageHTML(){
  const dailyEff = getEffectiveTargetMinutes(userSettings.dailyTargets, null, new Date());
  const weekStart = getPeriodRange("week",0).start;
  const weeklyEff = getEffectiveTargetMinutes(userSettings.weeklyTargets, userSettings.weeklyTargetMinutes, weekStart);
  return `
    <div class="rl-header" style="display:flex;align-items:center;gap:10px;">
      <span id="backBtn" style="cursor:pointer;display:flex;">${ICONS.chevronLeft}</span>
      <div class="rl-title" style="font-size:18px;">Targets</div>
    </div>
    <div class="rl-body">
      ${profileMsg ? `<div class="auth-error" style="background:#E4EEEC;color:var(--teal);">${esc(profileMsg)}</div>` : ""}
      <div class="rl-card card-gap">
        <div class="rl-section-label"><span>Daily target</span></div>
        <div style="font-family:var(--font-head);font-size:24px;font-weight:600;margin-bottom:14px;">${dailyEff>0?formatDuration(dailyEff):"Not set"}</div>
        <div class="rl-row2">
          <div><input class="rl-input" type="number" min="0" id="dailyTargetHours" placeholder="Hours" /></div>
          <div><input class="rl-input" type="number" min="0" id="dailyTargetMinutes" placeholder="Minutes" /></div>
        </div>
        <button class="rl-btn ghost" id="saveDailyTargetBtn" style="margin-top:10px;">Update daily target</button>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:8px;">Applies from today onward — past days keep their original target.</div>
      </div>
      <div class="rl-card">
        <div class="rl-section-label"><span>Weekly target</span></div>
        <div style="font-family:var(--font-head);font-size:24px;font-weight:600;margin-bottom:14px;">${weeklyEff>0?formatDuration(weeklyEff):"Not set"}</div>
        <div class="rl-row2">
          <div><input class="rl-input" type="number" min="0" id="weeklyTargetHours" placeholder="Hours" /></div>
          <div><input class="rl-input" type="number" min="0" id="weeklyTargetMinutes" placeholder="Minutes" /></div>
        </div>
        <button class="rl-btn ghost" id="saveWeeklyTargetBtn" style="margin-top:10px;">Update weekly target</button>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:8px;">Applies from this week onward — past weeks keep their original target.</div>
      </div>
    </div>
  `;
}
function renderTargetsPage(){
  document.getElementById("app").innerHTML = targetsPageHTML();
  document.getElementById("backBtn").addEventListener("click", () => { page = "profile"; profileMsg = ""; render(); });
  document.getElementById("saveDailyTargetBtn").addEventListener("click", () => {
    const h = Number(document.getElementById("dailyTargetHours").value)||0;
    const m = Number(document.getElementById("dailyTargetMinutes").value)||0;
    const total = h*60+m;
    if (total <= 0) { profileMsg = "Enter a value greater than 0."; renderTargetsPage(); return; }
    addTarget("daily", total, dateKey(new Date()));
    profileMsg = "Daily target updated.";
    renderTargetsPage();
  });
  document.getElementById("saveWeeklyTargetBtn").addEventListener("click", () => {
    const h = Number(document.getElementById("weeklyTargetHours").value)||0;
    const m = Number(document.getElementById("weeklyTargetMinutes").value)||0;
    const total = h*60+m;
    if (total <= 0) { profileMsg = "Enter a value greater than 0."; renderTargetsPage(); return; }
    addTarget("weekly", total, dateKey(getPeriodRange("week",0).start));
    profileMsg = "Weekly target updated.";
    renderTargetsPage();
  });
}

/* ---------- subjects page ---------- */
function subjectsPageHTML(){
  const sorted = getSortedSubjects();
  return `
    <div class="rl-header" style="display:flex;align-items:center;gap:10px;">
      <span id="backBtn" style="cursor:pointer;display:flex;">${ICONS.chevronLeft}</span>
      <div class="rl-title" style="font-size:18px;">Subjects</div>
    </div>
    <div class="rl-body">
      ${sorted.length ? `
        <div class="rl-card card-gap">
          ${sorted.map((s,i) => `
            <div class="rl-entry" style="align-items:center;flex-wrap:wrap;">
              <input type="color" class="subj-color-input" data-id="${s.id}" value="${s.color}" style="width:30px;height:30px;border:none;border-radius:6px;padding:0;cursor:pointer;flex-shrink:0;" />
              ${editingSubjectId === s.id ? `
                <input class="rl-input" id="renameInput" value="${esc(s.name)}" placeholder="Name" style="flex:1;min-width:100px;padding:6px 8px;" />
                <input class="rl-input" id="renameShortInput" value="${esc(s.shortCode||"")}" placeholder="Code" style="width:70px;padding:6px 8px;" />
                <span class="save-rename" data-id="${s.id}" style="color:var(--teal);cursor:pointer;display:flex;">${ICONS.check}</span>
                <span class="cancel-rename" style="color:var(--ink-soft);cursor:pointer;display:flex;">${ICONS.x}</span>
              ` : `
                <span style="flex:1;font-size:14px;">${esc(s.name)}${s.shortCode?` <span style="color:var(--ink-soft);font-size:12px;">(${esc(s.shortCode)})</span>`:""}</span>
                <span class="edit-subj-name" data-id="${s.id}" style="color:var(--ink-soft);cursor:pointer;display:flex;">${ICONS.pencil}</span>
              `}
              <span class="move-up" data-id="${s.id}" style="color:${i===0?"var(--line)":"var(--ink-soft)"};cursor:${i===0?"default":"pointer"};display:flex;">${ICONS.arrowUp}</span>
              <span class="move-down" data-id="${s.id}" style="color:${i===sorted.length-1?"var(--line)":"var(--ink-soft)"};cursor:${i===sorted.length-1?"default":"pointer"};display:flex;">${ICONS.arrowDown}</span>
              <span class="del-subj-profile" data-id="${s.id}" style="color:${entries.some(e=>e.subjectId===s.id)?"var(--line)":"var(--danger)"};cursor:pointer;display:flex;">${ICONS.trash}</span>
            </div>
          `).join("")}
        </div>
      ` : `<div class="rl-empty" style="padding:20px 0;">No subjects yet — add your first one below.</div>`}
      <div class="rl-card">
        <div class="rl-section-label"><span>Add subject</span></div>
        <div class="rl-field"><input class="rl-input" id="newSubjectInput" placeholder="Subject name" /></div>
        <div class="rl-field"><input class="rl-input" id="newSubjectShortInput" placeholder="Short code (optional, e.g. ANA)" /></div>
        <button class="rl-btn" id="confirmSubjectBtn">${ICONS.plus} Add subject</button>
      </div>
    </div>
  `;
}
function renderSubjectsPage(){
  document.getElementById("app").innerHTML = subjectsPageHTML();
  document.getElementById("backBtn").addEventListener("click", () => { page = "profile"; render(); });
  document.querySelectorAll(".subj-color-input").forEach(el => el.addEventListener("change", (e) => setSubjectColor(el.dataset.id, e.target.value)));
  document.querySelectorAll(".edit-subj-name").forEach(el => el.addEventListener("click", () => { editingSubjectId = el.dataset.id; renderSubjectsPage(); }));
  document.querySelectorAll(".save-rename").forEach(el => el.addEventListener("click", () => {
    const name = document.getElementById("renameInput").value;
    const code = document.getElementById("renameShortInput").value;
    renameSubject(el.dataset.id, name, code);
    editingSubjectId = null;
  }));
  document.querySelectorAll(".cancel-rename").forEach(el => el.addEventListener("click", () => { editingSubjectId = null; renderSubjectsPage(); }));
  document.querySelectorAll(".move-up").forEach(el => el.addEventListener("click", () => moveSubject(el.dataset.id, -1)));
  document.querySelectorAll(".move-down").forEach(el => el.addEventListener("click", () => moveSubject(el.dataset.id, 1)));
  document.querySelectorAll(".del-subj-profile").forEach(el => el.addEventListener("click", () => deleteSubject(el.dataset.id)));
  document.getElementById("confirmSubjectBtn").addEventListener("click", () => {
    const name = document.getElementById("newSubjectInput").value;
    const code = document.getElementById("newSubjectShortInput").value;
    addSubject(name, code);
    renderSubjectsPage();
  });
}

/* ---------- event handlers (main tabs) ---------- */
function attachHandlers(){
  if (tab === "log") {
    document.querySelectorAll(".subj-chip").forEach(el => el.addEventListener("click", () => {
      const id = el.dataset.id;
      selectedSubjectId = (selectedSubjectId === id) ? "" : id;
      renderBody();
    }));
    const goToSubjBtn = document.getElementById("goToSubjectsBtn");
    if (goToSubjBtn) goToSubjBtn.addEventListener("click", () => { page = "subjects"; render(); });

    const hoursInput = document.getElementById("hoursInput");
    if (hoursInput) {
      hoursInput.addEventListener("input", (e) => { hours = Math.max(0, Number(e.target.value)||0); updateSaveBtnState(); });
      hoursInput.addEventListener("change", () => { normalizeDuration(); renderBody(); });
    }
    const minutesInput = document.getElementById("minutesInput");
    if (minutesInput) {
      minutesInput.addEventListener("input", (e) => { minutes = Math.max(0, Number(e.target.value)||0); updateSaveBtnState(); });
      minutesInput.addEventListener("change", () => { normalizeDuration(); renderBody(); });
    }
    const dateInput = document.getElementById("dateInput");
    if (dateInput) dateInput.addEventListener("input", (e) => { dateVal = e.target.value; renderBody(); });
    const timeInput = document.getElementById("timeInput");
    if (timeInput) timeInput.addEventListener("input", (e) => { timeVal = e.target.value; });
    const titleInput = document.getElementById("titleInput");
    if (titleInput) titleInput.addEventListener("input", (e) => { window.__title = e.target.value; });

    const saveBtn = document.getElementById("saveEntryBtn");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      const title = (document.getElementById("titleInput").value || "").trim();
      const durationMin = hours*60 + minutes;
      if (!title || !selectedSubjectId || durationMin <= 0 || !dateVal || !timeVal) return;
      const newEntry = { title, subjectId: selectedSubjectId, durationMin, completedAt: new Date(`${dateVal}T${timeVal}`).toISOString() };
      const achievements = computeAchievements(newEntry);
      addEntry(newEntry);
      window.__title = ""; hours = 0; minutes = 30;
      const np = nowParts(); dateVal = np.d; timeVal = np.t;
      renderBody();
      const ti = document.getElementById("titleInput");
      if (ti) ti.value = "";
      if (achievements.length) showNextAchievement(achievements);
    });
  }

  if (tab === "history") {
    document.querySelectorAll(".rl-del-btn").forEach(el => el.addEventListener("click", () => {
      const id = el.dataset.id;
      if (pendingDeleteEntryId === id) { deleteEntry(id); pendingDeleteEntryId = null; }
      else { pendingDeleteEntryId = id; renderBody(); }
    }));
  }

  if (tab === "analyze") {
    document.querySelectorAll("[data-period]").forEach(el => el.addEventListener("click", () => { period = el.dataset.period; periodOffset = 0; renderBody(); }));
    const subjectFilterSelect = document.getElementById("subjectFilterSelect");
    if (subjectFilterSelect) subjectFilterSelect.addEventListener("change", (e) => { subjectFilter = e.target.value; renderBody(); });
    const prevBtn = document.getElementById("prevPeriodBtn");
    if (prevBtn) prevBtn.addEventListener("click", () => { if (period !== "all") { periodOffset++; renderBody(); } });
    const nextBtn = document.getElementById("nextPeriodBtn");
    if (nextBtn) nextBtn.addEventListener("click", () => { if (period !== "all" && periodOffset > 0) { periodOffset--; renderBody(); } });
  }
}

/* ---------- install prompt ---------- */
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); });
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
if (!isStandalone) document.getElementById("installHint").classList.add("show");

/* ---------- service worker ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- boot ---------- */
if (!firebaseReady) {
  renderConfigWarning();
} else {
  document.getElementById("app").innerHTML = `<div class="auth-wrap" style="align-items:center;"><span class="spin">⏳</span></div>`;
  auth.onAuthStateChanged((user) => {
    currentUser = user;
    if (user) { page = "main"; attachListeners(user.uid); render(); }
    else { detachListeners(); subjects = []; entries = []; userSettings = { weeklyTargetMinutes: null, photoURL: null, dailyTargets: [], weeklyTargets: [] }; render(); }
  });
}
</script>
